# 24-view mv2 collection for YAM (322x238 rgb + depth, observer-anchored ring),
# same spec as the aloha collect_obs24 dataset. Replays the trajectories the
# collect_yam run planned on the official aloha seed list:
#   1. python script/plan_seed_list.py lift_pot collect_yam task_config/lift_pot_official_seeds.txt
#   2. cp -r data/lift_pot/collect_yam/{_traj_data,seed.txt} data_obs24/lift_pot/collect_yam_obs24/
#   3. ROBOTWIN_SHADER=rt ROBOTWIN_RT_SPP=32 ROBOTWIN_DENOISER=optix \
#      python script/collect_data.py lift_pot collect_yam_obs24
# TCP: the saved endpose satisfies TCP = endpose + 0.12 * grasp-frame x-axis for
# every embodiment (robot.py subtracts 0.12 from gripper_bias), so the same TCP
# label pipeline as the aloha data applies unchanged.
render_freq: 0
episode_num: 50
use_seed: true
save_freq: 15
embodiment: [yam-mv2, yam-mv2, 0.80]
language_num: 10
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
  # match the RNG stream the trajectories were planned with (collect_yam.yml);
  # ring cameras themselves consume no draws (random_head_camera_dis is 0)
  rng_static_camera_compat: 2
model_ids:
  060_kitchenpot: 0
data_type:
  rgb: true
  third_view: false
  depth: true
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data_obs24
clear_cache_freq: 5
collect_data: true
eval_video_log: true

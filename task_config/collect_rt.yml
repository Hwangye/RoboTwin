# RT re-collection with the stock aloha-agilex embodiment (official cameras only).
# Seed search from 0 with our own expert: the official _traj_data cannot be
# replayed because our fork's handover_mic.py issues more planning calls than
# the recorded path has segments (IndexError on right_joint_path). Scenes still
# reproduce the official ones seed-for-seed thanks to the camera.py RNG patch --
# verify by comparing the resulting seed.txt with the official one.
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 10
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: true
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data_aloha_rt
clear_cache_freq: 5
collect_data: true
eval_video_log: true
